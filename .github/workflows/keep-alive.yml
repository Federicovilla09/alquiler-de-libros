name: Mantener activa la base de datos

on:
  schedule:
    - cron: '0 12 * * *'   # todos los días, a las 12:00 UTC (9:00 en Argentina)
  workflow_dispatch:        # también se puede correr a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el catálogo
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/catalog_books?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
